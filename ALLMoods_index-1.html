<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#17112f">
<title>ALLMoods</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;color:white;background:linear-gradient(135deg,#100b25,#321653,#092d46)}
.card{width:100%;max-width:420px;padding:28px 22px;border:1px solid #ffffff30;border-radius:28px;background:#ffffff12;backdrop-filter:blur(22px);box-shadow:0 25px 70px #0006}
.logo{width:70px;height:70px;margin:auto;display:flex;align-items:center;justify-content:center;border-radius:22px;font-size:36px;font-weight:bold;background:linear-gradient(135deg,#a855f7,#ec4899,#ff8a00)}
h1{text-align:center;margin:12px 0 5px;font-size:32px}.subtitle{text-align:center;color:#ddd3ef;margin:0 0 25px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{flex:1;padding:13px 5px;border:1px solid #ffffff30;border-radius:13px;background:#ffffff0b;color:white;font-weight:bold}.tab.active{background:linear-gradient(100deg,#9b35ff,#ed168d,#ff7517);border:0}
input,select{width:100%;padding:14px 12px;margin:7px 0;border-radius:13px;border:1px solid #ffffff35;outline:none;background:#ffffff0d;color:white;font-size:15px}input::placeholder{color:#cfc6dc}select option{background:#241637;color:white}
button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:13px;font-size:15px;font-weight:bold;cursor:pointer;color:white;background:linear-gradient(100deg,#9333ea,#db2777,#ff7517)}button:disabled{opacity:.6}.secondary{background:#ffffff10;border:1px solid #ffffff35}.link{text-align:right;margin:8px 0;color:#e5aaff;font-size:13px;cursor:pointer}.divider{text-align:center;color:#cfc5df;margin:17px 0}.phoneRow{display:flex;gap:8px}.phoneRow select{width:45%;font-size:12px}.phoneRow input{width:55%}.hidden{display:none!important}.message{display:none;margin-top:12px;padding:11px;border-radius:12px;background:#ffffff15;font-size:13px;line-height:1.5}.message.show{display:block}.small{text-align:center;color:#cfc4d9;font-size:12px}.welcome{text-align:center}.welcomeIcon{font-size:55px;margin:10px}
</style>
</head>
<body>
<div class="card">
<div class="logo">A</div><h1>ALLMoods</h1><p class="subtitle">Your mood. Your people. Your world. ✨</p>

<section id="loginPage">
<div class="tabs"><button id="emailLoginTab" class="tab active">Email Login</button><button id="phoneLoginTab" class="tab">Phone Login</button></div>
<div id="emailLoginBox">
<input id="loginEmail" type="email" placeholder="Email address">
<input id="loginPassword" type="password" placeholder="Password">
<div id="forgotPassword" class="link">Forgot Password?</div>
<button id="loginButton">Login</button>
<button id="googleButton" class="secondary">🌐 Continue with Google</button>
<div class="divider">OR</div><button id="openSignupButton">Create Account</button>
</div>
<div id="phoneLoginBox" class="hidden">
<div class="phoneRow"><select id="loginCountryCode"><option value="+91">🇮🇳 India (+91)</option><option value="+1">🇺🇸 USA (+1)</option><option value="+44">🇬🇧 UK (+44)</option><option value="+971">🇦🇪 UAE (+971)</option></select><input id="loginPhone" type="tel" placeholder="Mobile number" maxlength="12"></div>
<div id="loginRecaptcha"></div><button id="loginOtpButton">Send OTP</button>
<div id="loginOtpBox" class="hidden"><input id="loginOtp" type="text" placeholder="Enter 6-digit OTP" maxlength="6"><button id="loginVerifyButton">Verify OTP & Login</button></div>
</div>
</section>

<section id="signupPage" class="hidden">
<div class="tabs"><button id="signupEmailTab" class="tab active">Email</button><button id="signupPhoneTab" class="tab">Mobile</button></div>
<div id="emailSignupBox">
<input id="signupName" placeholder="Your name"><input id="signupEmail" type="email" placeholder="Email address"><input id="signupPassword" type="password" placeholder="Create password"><input id="signupConfirmPassword" type="password" placeholder="Confirm password"><button id="createEmailButton">Create Account</button>
</div>
<div id="phoneSignupBox" class="hidden">
<input id="phoneSignupName" placeholder="Your name">
<div class="phoneRow"><select id="signupCountryCode"><option value="+91">🇮🇳 India (+91)</option><option value="+1">🇺🇸 USA (+1)</option><option value="+44">🇬🇧 UK (+44)</option><option value="+971">🇦🇪 UAE (+971)</option></select><input id="signupPhone" type="tel" placeholder="Mobile number" maxlength="12"></div>
<div id="signupRecaptcha"></div><button id="signupOtpButton">Send OTP</button>
<div id="signupOtpBox" class="hidden"><input id="signupOtp" type="text" placeholder="Enter 6-digit OTP" maxlength="6"><button id="createPhoneButton">Verify OTP & Create Account</button></div>
</div>
<div class="divider">Already have an account?</div><button id="backLoginButton" class="secondary">← Back to Login</button>
</section>

<section id="welcomePage" class="hidden"><div class="welcome"><div class="welcomeIcon">🎉</div><h2>Welcome to ALLMoods!</h2><p id="userInfo"></p><button id="logoutButton">Logout</button></div></section>
<div id="message" class="message"></div><p class="small">ALLMoods • Connect • Share • Express</p>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,updateProfile,signOut,onAuthStateChanged,RecaptchaVerifier,signInWithPhoneNumber}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyAIMEhlXMTDH0NTvda3_sIS3D_KOc6Ogmk",
authDomain:"allmoods-621a2.firebaseapp.com",
projectId:"allmoods-621a2",
storageBucket:"allmoods-621a2.firebasestorage.app",
messagingSenderId:"564262205478",
appId:"1:564262205478:web:18cbb67b5f21f63f2d4ee7",
measurementId:"G-WJMFT93HTQ"
};
const auth=getAuth(initializeApp(firebaseConfig)),googleProvider=new GoogleAuthProvider();
let loginConfirm=null,signupConfirm=null,loginRecaptcha=null,signupRecaptcha=null;
const $=id=>document.getElementById(id);
function msg(t){$("message").textContent=t;$("message").classList.add("show")}
function clearMsg(){$("message").textContent="";$("message").classList.remove("show")}

onAuthStateChanged(auth,user=>{
$("loginPage").classList.toggle("hidden",!!user);$("signupPage").classList.add("hidden");$("welcomePage").classList.toggle("hidden",!user);
if(user)$("userInfo").textContent="Logged in as: "+(user.displayName||user.email||user.phoneNumber||"ALLMoods User");
});

$("emailLoginTab").onclick=()=>{$("emailLoginTab").classList.add("active");$("phoneLoginTab").classList.remove("active");$("emailLoginBox").classList.remove("hidden");$("phoneLoginBox").classList.add("hidden")};
$("phoneLoginTab").onclick=()=>{$("phoneLoginTab").classList.add("active");$("emailLoginTab").classList.remove("active");$("phoneLoginBox").classList.remove("hidden");$("emailLoginBox").classList.add("hidden")};
$("openSignupButton").onclick=()=>{$("loginPage").classList.add("hidden");$("signupPage").classList.remove("hidden");clearMsg()};
$("backLoginButton").onclick=()=>{$("signupPage").classList.add("hidden");$("loginPage").classList.remove("hidden");clearMsg()};
$("signupEmailTab").onclick=()=>{$("signupEmailTab").classList.add("active");$("signupPhoneTab").classList.remove("active");$("emailSignupBox").classList.remove("hidden");$("phoneSignupBox").classList.add("hidden")};
$("signupPhoneTab").onclick=()=>{$("signupPhoneTab").classList.add("active");$("signupEmailTab").classList.remove("active");$("phoneSignupBox").classList.remove("hidden");$("emailSignupBox").classList.add("hidden")};

$("loginButton").onclick=async()=>{clearMsg();let e=$("loginEmail").value.trim(),p=$("loginPassword").value;if(!e||!p)return msg("Email aur password enter karo.");try{await signInWithEmailAndPassword(auth,e,p)}catch(x){msg("Login failed: "+x.message)}};
$("createEmailButton").onclick=async()=>{clearMsg();let n=$("signupName").value.trim(),e=$("signupEmail").value.trim(),p=$("signupPassword").value,c=$("signupConfirmPassword").value;if(!n||!e||!p||!c)return msg("Sabhi fields fill karo.");if(p.length<6)return msg("Password minimum 6 characters ka hona chahiye.");if(p!==c)return msg("Password match nahi kar raha.");try{let r=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(r.user,{displayName:n})}catch(x){msg("Account error: "+x.message)}};
$("googleButton").onclick=async()=>{clearMsg();try{await signInWithPopup(auth,googleProvider)}catch(x){msg("Google error: "+x.message)}};
$("forgotPassword").onclick=async()=>{let e=$("loginEmail").value.trim();if(!e)return msg("Pehle email enter karo.");try{await sendPasswordResetEmail(auth,e);msg("Password reset email bhej diya gaya hai.")}catch(x){msg("Reset error: "+x.message)}};

async function loginRecaptchaSetup(){if(!loginRecaptcha){loginRecaptcha=new RecaptchaVerifier(auth,"loginRecaptcha",{size:"normal"});await loginRecaptcha.render()}}
$("loginOtpButton").onclick=async()=>{clearMsg();let n=$("loginPhone").value.replace(/\D/g,"");if(!n)return msg("Mobile number enter karo.");try{await loginRecaptchaSetup();loginConfirm=await signInWithPhoneNumber(auth,$("loginCountryCode").value+n,loginRecaptcha);$("loginOtpBox").classList.remove("hidden");msg("OTP bhej diya gaya hai.")}catch(x){msg("OTP error: "+x.message)}};
$("loginVerifyButton").onclick=async()=>{let c=$("loginOtp").value.trim();if(!loginConfirm)return msg("Pehle Send OTP dabao.");try{await loginConfirm.confirm(c)}catch(x){msg("OTP verification failed: "+x.message)}};

async function signupRecaptchaSetup(){if(!signupRecaptcha){signupRecaptcha=new RecaptchaVerifier(auth,"signupRecaptcha",{size:"normal"});await signupRecaptcha.render()}}
$("signupOtpButton").onclick=async()=>{clearMsg();let n=$("phoneSignupName").value.trim(),p=$("signupPhone").value.replace(/\D/g,"");if(!n||!p)return msg("Name aur mobile number enter karo.");try{await signupRecaptchaSetup();signupConfirm=await signInWithPhoneNumber(auth,$("signupCountryCode").value+p,signupRecaptcha);$("signupOtpBox").classList.remove("hidden");msg("OTP bhej diya gaya hai.")}catch(x){msg("OTP error: "+x.message)}};
$("createPhoneButton").onclick=async()=>{let c=$("signupOtp").value.trim();if(!signupConfirm)return msg("Pehle Send OTP dabao.");try{let r=await signupConfirm.confirm(c);await updateProfile(r.user,{displayName:$("phoneSignupName").value.trim()})}catch(x){msg("Account creation failed: "+x.message)}};
$("logoutButton").onclick=()=>signOut(auth);
</script>
</body>
</html>
