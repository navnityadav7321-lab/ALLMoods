
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d25">
<title>ALLMoods</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;color:white;
  background:linear-gradient(135deg,#100d25,#39205c,#092b48);
  background-size:200% 200%;animation:bg 12s infinite alternate;
}
@keyframes bg{to{background-position:100% 100%}}
.card{
  width:100%;max-width:430px;padding:26px 20px;
  border:1px solid #ffffff35;border-radius:25px;
  background:#ffffff12;backdrop-filter:blur(18px);
  box-shadow:0 20px 60px #0005;
}
.logo{
  width:68px;height:68px;margin:0 auto 12px;
  display:grid;place-items:center;border-radius:22px;
  background:linear-gradient(135deg,#a855f7,#ec4899,#fb923c);
  font-size:34px;font-weight:bold;
}
h1{text-align:center;font-size:30px;margin:5px 0}
.subtitle{text-align:center;color:#d9cbed;font-size:13px;margin:8px 0 24px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{
  flex:1;padding:12px 5px;border:1px solid #ffffff30;
  border-radius:12px;background:#ffffff0b;color:white;
}
.tab.active,.main-btn{
  background:linear-gradient(100deg,#9333ea,#db2777,#f97316);
  color:white;border:0;
}
.field-label{display:block;font-size:13px;margin:13px 0 7px}
input,select{
  width:100%;min-width:0;padding:13px 11px;
  border:1px solid #ffffff30;border-radius:12px;
  color:white;background:#ffffff0c;font-size:14px;outline:none;
}
input::placeholder{color:#c8bed8}
select option{background:#211737;color:white}
input:focus,select:focus{border-color:#d8b4fe}
.phone-row{display:flex;gap:8px}
.phone-row select{flex:0 0 46%;font-size:12px;padding:12px 5px}
.phone-row input{flex:1;width:54%}
.main-btn,.google-btn{
  width:100%;padding:14px 10px;margin-top:15px;
  border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;
}
.google-btn{background:#ffffff10;border:1px solid #ffffff30;color:white}
button:disabled{opacity:.6}
.forgot{
  display:block;text-align:right;margin-top:12px;
  color:#e9b8ff;font-size:13px;cursor:pointer
}
.divider{text-align:center;color:#cfc5e1;font-size:12px;margin:16px 0}
.message{
  display:none;margin-top:14px;padding:11px;border-radius:10px;
  background:#ffffff15;font-size:13px;line-height:1.5;overflow-wrap:anywhere
}
.message.show{display:block}
.small{text-align:center;color:#cfc5e1;font-size:11px;line-height:1.6;margin-top:20px}
.hidden{display:none!important}
#recaptcha-container{margin-top:12px;display:flex;justify-content:center;overflow:hidden}
</style>
</head>

<body>
<main class="card">
  <div class="logo">A</div>
  <h1>ALLMoods</h1>
  <p class="subtitle">Your mood. Your people. Your world.</p>

  <section id="authSection">
    <div class="tabs">
      <button type="button" class="tab active" id="emailTab">Email Login</button>
      <button type="button" class="tab" id="phoneTab">Phone OTP</button>
    </div>

    <form id="emailForm">
      <label class="field-label" for="email">Email address</label>
      <input id="email" type="email" placeholder="Enter email"
             autocomplete="email" required>

      <label class="field-label" for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password"
             autocomplete="current-password" required>

      <span class="forgot" id="forgotBtn">Forgot password?</span>

      <button class="main-btn" id="emailBtn" type="submit">Login</button>
      <button class="google-btn" id="googleBtn" type="button">
        🌐 Continue with Google
      </button>
      <p class="divider">OR</p>
      <button class="main-btn" id="createBtn" type="button">
        Create New Account
      </button>
    </form>

    <form id="phoneForm" class="hidden">
      <label class="field-label" for="phone">Mobile number</label>

      <div class="phone-row">
        <select id="countryCode" aria-label="Country code">
          <option value="+91" selected>🇮🇳 India (+91)</option>
          <option value="+1">🇺🇸 USA (+1)</option>
          <option value="+44">🇬🇧 UK (+44)</option>
          <option value="+971">🇦🇪 UAE (+971)</option>
          <option value="+61">🇦🇺 Australia (+61)</option>
          <option value="+977">🇳🇵 Nepal (+977)</option>
          <option value="+880">🇧🇩 Bangladesh (+880)</option>
          <option value="+94">🇱🇰 Sri Lanka (+94)</option>
          <option value="+92">🇵🇰 Pakistan (+92)</option>
          <option value="+86">🇨🇳 China (+86)</option>
        </select>
        <input id="phone" type="tel" inputmode="numeric"
               autocomplete="tel-national" placeholder="Mobile number"
               maxlength="15" required>
      </div>

      <div id="recaptcha-container"></div>
      <button class="main-btn" id="otpBtn" type="button">Send OTP</button>

      <div id="otpSection" class="hidden">
        <label class="field-label" for="otp">Enter OTP</label>
        <input id="otp" type="text" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6"
               placeholder="6-digit OTP">
        <button class="main-btn" id="verifyBtn" type="button">
          Verify OTP & Login
        </button>
      </div>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p class="small">Welcome to ALLMoods. Connect and share your moments.</p>
  </section>

  <section id="welcomeSection" class="hidden">
    <h2 style="text-align:center">Welcome to ALLMoods! 🎉</h2>
    <p id="userInfo" style="text-align:center;margin-top:15px;overflow-wrap:anywhere"></p>
    <button class="main-btn" id="logoutBtn" type="button">Logout</button>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, sendPasswordResetEmail,
  RecaptchaVerifier, signInWithPhoneNumber,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

/* YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAIMEmlXMTDH0NTvda3_sIS3D_KOc6Ogmk",
  authDomain: "allmoods-621a2.firebaseapp.com",
  projectId: "allmoods-621a2",
  storageBucket: "allmoods-621a2.firebasestorage.app",
  messagingSenderId: "564262205478",
  appId: "1:564262205478:web:18cbb67b5f21f63f2d4ee7",
  measurementId: "G-WJMFT93HTQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const $ = id => document.getElementById(id);

let confirmationResult = null;
let recaptchaVerifier = null;
let recaptchaWidgetId = null;

function message(text) {
  $("message").textContent = text;
  $("message").classList.add("show");
}
function clearMessage() {
  $("message").textContent = "";
  $("message").classList.remove("show");
}
function busy(button, yes, label = "Please wait...") {
  if (yes) {
    button.dataset.oldText = button.textContent;
    button.textContent = label;
    button.disabled = true;
  } else {
    button.disabled = false;
    if (button.dataset.oldText) button.textContent = button.dataset.oldText;
  }
}

onAuthStateChanged(auth, user => {
  if (user) {
    $("authSection").classList.add("hidden");
    $("welcomeSection").classList.remove("hidden");
    $("userInfo").textContent =
      "Signed in as: " + (user.email || user.phoneNumber || "ALLMoods user");
  } else {
    $("welcomeSection").classList.add("hidden");
    $("authSection").classList.remove("hidden");
  }
});

try {
  await getRedirectResult(auth);
} catch (error) {
  message("Google login error: " + error.message);
}

$("emailTab").onclick = () => {
  clearMessage();
  $("emailTab").classList.add("active");
  $("phoneTab").classList.remove("active");
  $("emailForm").classList.remove("hidden");
  $("phoneForm").classList.add("hidden");
};

$("phoneTab").onclick = () => {
  clearMessage();
  $("phoneTab").classList.add("active");
  $("emailTab").classList.remove("active");
  $("phoneForm").classList.remove("hidden");
  $("emailForm").classList.add("hidden");
};

$("emailForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();
  const button = $("emailBtn");
  busy(button, true, "Logging in...");
  try {
    await signInWithEmailAndPassword(
      auth, $("email").value.trim(), $("password").value
    );
    message("Login successful!");
  } catch (error) {
    message("Login failed: " + error.message);
  } finally {
    busy(button, false);
  }
});

$("createBtn").onclick = async () => {
  clearMessage();
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("Pehle email aur password enter karo.");
    return;
  }
  if (password.length < 6) {
    message("Password kam se kam 6 characters ka hona chahiye.");
    return;
  }

  busy($("createBtn"), true, "Creating account...");
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    message("Account created successfully!");
  } catch (error) {
    message("Account error: " + error.message);
  } finally {
    busy($("createBtn"), false);
  }
};

$("forgotBtn").onclick = async () => {
  clearMessage();
  const email = $("email").value.trim();
  if (!email) {
    message("Password reset ke liye pehle email enter karo.");
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    message("Agar email account registered hai, password reset link bhej diya gaya hai.");
  } catch (error) {
    message("Reset error: " + error.message);
  }
};

$("googleBtn").onclick = async () => {
  clearMessage();
  busy($("googleBtn"), true, "Connecting to Google...");
  try {
    await signInWithPopup(auth, googleProvider);
    message("Google login successful!");
  } catch (error) {
    if (error.code === "auth/popup-blocked") {
      try {
        await signInWithRedirect(auth, googleProvider);
        return;
      } catch (redirectError) {
        message("Google login error: " + redirectError.message);
      }
    } else {
      message("Google login error: " + error.message);
    }
  } finally {
    busy($("googleBtn"), false);
  }
};

async function setupRecaptcha() {
  if (recaptchaVerifier) return;
  recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
    size: "normal",
    callback: () => {},
    "expired-callback": () => {
      message("reCAPTCHA expire ho gaya. Dobara verify karo.");
    }
  });
  recaptchaWidgetId = await recaptchaVerifier.render();
}

$("otpBtn").onclick = async () => {
  clearMessage();
  const digits = $("phone").value.replace(/\D/g, "");
  const countryCode = $("countryCode").value;

  if (!/^\d{6,12}$/.test(digits)) {
    message("Sahi mobile number enter karo.");
    return;
  }

  const phoneNumber = countryCode + digits;
  busy($("otpBtn"), true, "Sending OTP...");

  try {
    await setupRecaptcha();
    confirmationResult = await signInWithPhoneNumber(
      auth, phoneNumber, recaptchaVerifier
    );
    $("otpSection").classList.remove("hidden");
    message("OTP bhej diya gaya hai. SMS check karo.");
  } catch (error) {
    message("OTP error: " + error.message);
    if (recaptchaVerifier) {
      try { recaptchaVerifier.clear(); } catch (_) {}
      recaptchaVerifier = null;
      recaptchaWidgetId = null;
      $("recaptcha-container").innerHTML = "";
    }
  } finally {
    busy($("otpBtn"), false);
  }
};

$("verifyBtn").onclick = async () => {
  clearMessage();
  const code = $("otp").value.trim();

  if (!confirmationResult) {
    message("Pehle Send OTP dabao.");
    return;
  }
  if (!/^\d{6}$/.test(code)) {
    message("6-digit OTP enter karo.");
    return;
  }

  busy($("verifyBtn"), true, "Verifying...");
  try {
    await confirmationResult.confirm(code);
    message("Phone verified. Login successful!");
  } catch (error) {
    message("OTP verification error: " + error.message);
  } finally {
    busy($("verifyBtn"), false);
  }
};

$("logoutBtn").onclick = async () => {
  try {
    await signOut(auth);
    confirmationResult = null;
    $("otpSection").classList.add("hidden");
    $("otp").value = "";
    message("You have logged out.");
  } catch (error) {
    message("Logout error: " + error.message);
  }
};
</script>
</body>
</html>
