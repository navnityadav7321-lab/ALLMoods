
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17123c">
<title>ALLMoods | Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:grid;place-items:center;
  font-family:Arial,sans-serif;color:white;
  background:linear-gradient(135deg,#17123c,#482575,#087d8a);
  overflow-x:hidden
}
body:before,body:after{
  content:"";position:fixed;width:260px;height:260px;
  border-radius:50%;filter:blur(65px);opacity:.4;
  animation:float 8s ease-in-out infinite alternate;pointer-events:none
}
body:before{background:#e14cff;top:5%;left:-100px}
body:after{background:#00e5c0;bottom:0;right:-100px;animation-delay:-4s}
@keyframes float{to{transform:translate(35px,45px) scale(1.2)}}
.card{
  position:relative;width:100%;max-width:420px;padding:28px;
  border:1px solid #ffffff40;border-radius:26px;
  background:#ffffff18;backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:0 25px 70px #0005;
  animation:appear .6s ease
}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;font-size:34px;font-weight:900;letter-spacing:2px}
.tagline{text-align:center;color:#e4e1ff;margin:8px 0 25px}
input,button{
  display:block;width:100%;padding:14px;margin:10px 0;
  border-radius:13px;font-size:15px
}
input{
  color:white;background:#ffffff12;
  border:1px solid #ffffff55;outline:none
}
input:focus{border-color:#75f0ff;box-shadow:0 0 0 2px #75f0ff20}
input::placeholder{color:#e2def0}
button{
  border:0;background:white;color:#292052;
  font-weight:bold;cursor:pointer;transition:.2s
}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.6;cursor:wait}
.secondary{background:#ffffff18;color:white;border:1px solid #ffffff50}
a{color:#fff;cursor:pointer;text-decoration:underline}
.small{text-align:center;font-size:13px}
.or{text-align:center;color:#ded8f8;font-size:13px;margin:17px 0}
#app,#otpArea{display:none}
#message{font-size:13px;text-align:center;line-height:1.5;overflow-wrap:anywhere;min-height:20px}
hr{border:0;border-top:1px solid #ffffff35;margin:22px 0}
.welcome{text-align:center;padding:15px 0}
.avatar{font-size:50px;margin:15px}
#recaptcha-container{margin:12px 0;overflow:hidden}
</style>
</head>

<body>
<div class="card">
  <div class="logo">ALLMoods</div>
  <div class="tagline">Your mood. Your people. ✨</div>

  <section id="loginArea">
    <input id="email" type="email" autocomplete="email"
      placeholder="Email address">
    <input id="password" type="password" autocomplete="current-password"
      placeholder="Password">

    <button id="loginBtn">Login with Email</button>
    <button id="signupBtn" class="secondary">Create New Account</button>
    <button id="googleBtn" class="secondary">🌐 Continue with Google</button>

    <p class="small"><a id="forgotBtn">Forgot Password?</a></p>

    <hr>
    <p class="small">Login with your phone number</p>
    <input id="phone" type="tel" autocomplete="tel"
      placeholder="Phone number, e.g. +919876543210">

    <div id="recaptcha-container"></div>
    <button id="otpBtn" class="secondary">Send OTP</button>

    <div id="otpArea">
      <input id="otp" type="text" inputmode="numeric"
        autocomplete="one-time-code" placeholder="Enter SMS OTP">
      <button id="verifyBtn">Verify OTP</button>
    </div>
  </section>

  <section id="app">
    <div class="welcome">
      <div class="avatar">🎉</div>
      <h2>Welcome to ALLMoods!</h2>
      <p id="userInfo"></p>
      <button id="logoutBtn">Logout</button>
    </div>
  </section>

  <div id="message" role="status" aria-live="polite"></div>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

// ALLMOODS FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAIMEmlXMTDH0NTvda3_sIS3D_KOc6Ogmk",
  authDomain: "allmoods-621a2.firebaseapp.com",
  projectId: "allmoods-621a2",
  storageBucket: "allmoods-621a2.firebasestorage.app",
  messagingSenderId: "564262205478",
  appId: "1:564262205478:web:18cbb67b5f21f63f2d4ee7",
  measurementId: "G-WJMFT93HTQ"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const googleProvider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
const showMessage = text => { $("message").textContent = text; };

let confirmationResult = null;
let recaptchaVerifier = null;
let recaptchaWidgetId = null;

onAuthStateChanged(auth, user => {
  $("loginArea").style.display = user ? "none" : "block";
  $("app").style.display = user ? "block" : "none";

  $("userInfo").textContent = user
    ? (user.displayName || user.email || user.phoneNumber || "Signed in")
    : "";
});

try {
  await getRedirectResult(auth);
} catch (error) {
  showMessage("Google login: " + error.message);
}

// EMAIL LOGIN
$("loginBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    showMessage("Email aur password dono bharo.");
    return;
  }

  try {
    showMessage("Logging in...");
    await signInWithEmailAndPassword(auth, email, password);
    showMessage("Login successful!");
  } catch (error) {
    showMessage(error.message);
  }
});

// CREATE ACCOUNT
$("signupBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    showMessage("Email aur password dono bharo.");
    return;
  }

  if (password.length < 6) {
    showMessage("Password kam se kam 6 characters ka rakho.");
    return;
  }

  try {
    showMessage("Creating account...");
    await createUserWithEmailAndPassword(auth, email, password);
    showMessage("Account created successfully!");
  } catch (error) {
    showMessage(error.message);
  }
});

// FORGOT PASSWORD
$("forgotBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();

  if (!email) {
    showMessage("Pehle email address bharo.");
    $("email").focus();
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("Agar account is email se registered hai, reset instructions bhej di gayi hain. Inbox check karo.");
  } catch (error) {
    showMessage(error.message);
  }
});

// GOOGLE LOGIN
$("googleBtn").addEventListener("click", async () => {
  try {
    showMessage("Google login khol rahe hain...");
    await signInWithPopup(auth, googleProvider);
  } catch (error) {
    if (
      error.code === "auth/popup-blocked" ||
      error.code === "auth/operation-not-supported-in-this-environment"
    ) {
      try {
        await signInWithRedirect(auth, googleProvider);
      } catch (redirectError) {
        showMessage(redirectError.message);
      }
    } else {
      showMessage(error.message);
    }
  }
});

// PHONE OTP: reCAPTCHA
async function setupRecaptcha() {
  if (recaptchaVerifier) return;

  recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
    size: "normal",
    callback: () => {
      showMessage("Verification complete. Send OTP dabao.");
    },
    "expired-callback": () => {
      showMessage("reCAPTCHA expire ho gaya. Dobara verify karo.");
    }
  });

  recaptchaWidgetId = await recaptchaVerifier.render();
}

// SEND PHONE OTP
$("otpBtn").addEventListener("click", async () => {
  const phone = $("phone").value.trim();

  if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
    showMessage("Country code ke saath number likho, jaise +919876543210.");
    return;
  }

  try {
    $("otpBtn").disabled = true;
    showMessage("Phone verification taiyar ho rahi hai...");

    await setupRecaptcha();

    confirmationResult = await signInWithPhoneNumber(
      auth,
      phone,
      recaptchaVerifier
    );

    $("otpArea").style.display = "block";
    showMessage("OTP bhej diya gaya hai. SMS check karo.");
  } catch (error) {
    showMessage("OTP nahi bhej paye: " + error.message);

    if (recaptchaVerifier) {
      try { await recaptchaVerifier.clear(); } catch {}
      recaptchaVerifier = null;
      recaptchaWidgetId = null;
    }
  } finally {
    $("otpBtn").disabled = false;
  }
});

// VERIFY OTP
$("verifyBtn").addEventListener("click", async () => {
  const code = $("otp").value.trim();

  if (!confirmationResult) {
    showMessage("Pehle Send OTP dabao.");
    return;
  }

  if (!code) {
    showMessage("SMS mein mila OTP enter karo.");
    return;
  }

  try {
    await confirmationResult.confirm(code);
    showMessage("Phone verified! Login successful.");
  } catch (error) {
    showMessage("OTP verify nahi hua: " + error.message);
  }
});

// LOGOUT
$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    showMessage("You have logged out.");
  } catch (error) {
    showMessage(error.message);
  }
});
</script>
</body>
</html>
